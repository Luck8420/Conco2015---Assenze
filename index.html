<style>

.avv{background:#fff3cd;border-left:6px solid #e0a800;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem;line-height:1.4}
.sh{font-weight:800;color:var(--c1);margin:14px 0 0}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:8px 0 12px}

.sc h4{margin:0 0 4px;color:var(--c1)}
.si{padding:7px 0;border-top:1px solid #eee;font-size:.92rem;cursor:pointer;line-height:1.35}
.tb{display:inline-block;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:800;vertical-align:1px}
.tb.BIANCA{background:var(--bianca);color:#222}.tb.ROSSA{background:var(--rossa);color:#fff}
.okk{color:#2e7d32}
.summary-item{margin-bottom:8px;font-size:.9rem;border-bottom:1px solid #eee;padding-bottom:6px}
.welcome-screen{display:flex;flex-direction:column;gap:12px;padding:10px 0}
#upd{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#222;color:#fff;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:.95rem}
#upd[hidden]{display:none}
</style></head><body>
<header><img id="logo" src="stemma.png" alt="" onerror="this.remove()">
<h1><span class="t1">Concorezzese</span><span class="t2">Esordienti U12 · 2015</span><span class="t3">Gestione assenze</span></h1><div id="hr"></div></header>
<main id="main">Caricamento…</main>
<div id="modal"></div>
<div id="ver" style="text-align:center;color:#999;font-size:.75rem;margin:16px 0 70px"></div>
<div id="upd" hidden></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, addDoc, deleteDoc, getDoc, onSnapshot, writeBatch, query, where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const FB = {
  apiKey: "AIzaSyBkIw4tdL9Lz8Rr1_kr7XzzVy1IQOs2ZCw",
  authDomain: "gestione-assenze-e87d7.firebaseapp.com",
  projectId: "gestione-assenze-e87d7",
  storageBucket: "gestione-assenze-e87d7.firebasestorage.app",
  messagingSenderId: "531728262014",
  appId: "1:531728262014:web:30f6d602c16dcb25a0092f"
};
const INIZIO = '2026-09-01';

const $ = s => document.querySelector(s);
const APP_VERSION = '1.0';   // da cambiare ad ogni nuovo file caricato su GitHub
const main = $('#main'), mod = $('#modal');
$('#ver').textContent = 'Versione ' + APP_VERSION;
// Controlla in silenzio se su GitHub c'è una versione più recente della pagina
let lastCheck = 0;
async function checkUpdate() {
  if (Date.now() - lastCheck < 5 * 60 * 1000 || !navigator.onLine) return;
  lastCheck = Date.now();
  try {
    const r = await fetch(location.pathname + '?nocache=' + Date.now(), {cache: 'no-store'});
    const m = /const APP_VERSION = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== APP_VERSION) {
      $('#upd').hidden = false;
      $('#upd').innerHTML = '<span>Nuova versione disponibile</span><button class="pri" data-upd>Aggiorna</button>';
    }
  } catch (_) { /* offline o errore di rete: riprova alla prossima apertura */ }
}
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (_) {} const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} document.cookie = k + '=' + encodeURIComponent(v) + ';max-age=31536000;path=' + location.pathname.replace(/[^/]*$/, '') + ';SameSite=Lax'; }
};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
const Q = new URLSearchParams(location.search);
if (Q.get('c')) store.set('c', Q.get('c'));
const code = store.get('c');
if (!code) { main.textContent = 'Usa il link ricevuto dalla società (quello con ?c=...).'; throw 0; }

const fbApp = initializeApp(FB);
let db;
try { db = initializeFirestore(fbApp, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
catch (_) { db = getFirestore(fbApp); }
const col = n => collection(db, 's', code, n);
const ref = (n, id) => doc(db, 's', code, n, id);
const D = {players: [], extras: [], abs: [], mods: {}, pause: [], sched: null};
let draft = null;
const DEF = {versions: [{from: '2026-09-01', rules: {
  BIANCA: [{d: 2, t: '18:00–20:00', y: 'Allenamento'}, {d: 4, t: '18:30–20:00', y: 'Allenamento'}, {d: 6, t: '', y: 'Campionato'}],
  ROSSA: [{d: 2, t: '18:00–20:00', y: 'Allenamento'}, {d: 5, t: '18:00–19:30', y: 'Allenamento'}, {d: 6, t: '', y: 'Campionato'}]}}]};
const SCHED = () => (D.sched && D.sched.versions && D.sched.versions.length ? D.sched : DEF);
const DOW = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const dmy = x => x.slice(8) + '/' + x.slice(5, 7) + '/' + x.slice(0, 4);
const TIPI = ['Allenamento', 'Campionato', 'Amichevole', 'Torneo'];
const kOf = t => t == 'Allenamento' ? 'A' : 'P';
let now0 = new Date();
let me = store.get('me'), tab = 'ev', admin = false, sel = null, selN = null;
const nav = {ev: {vw: 'w', wk: 0, mon: {y: now0.getFullYear(), m: now0.getMonth()}}, adm: {vw: 'w', wk: 0, mon: {y: now0.getFullYear(), m: now0.getMonth()}}};
const V = () => nav[staffView() ? 'adm' : 'ev'];
function resetView() {   // ogni accesso riparte dalla settimana in corso
  now0 = new Date();
  ['ev', 'adm'].forEach(k => { nav[k] = {vw: 'w', wk: 0, mon: {y: now0.getFullYear(), m: now0.getMonth()}}; });
  sel = null; selN = null;
}

const GG = ['dom','lun','mar','mer','gio','ven','sab'];
const MES3 = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const abb = t => ({Allenamento: 'Allen.', Campionato: 'Camp.', Amichevole: 'Amic.', Torneo: 'Torneo'}[t] || String(t).slice(0, 5) + '.');
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Indici in memoria: evitano ricerche lineari ad ogni cella del calendario
const IX = {pl: new Map(), ab: new Map(), byEv: new Map(), tot: {BIANCA: 0, ROSSA: 0}};
function reindex() {
  IX.pl = new Map(D.players.map(p => [Number(p.n), p]));
  IX.tot = {BIANCA: 0, ROSSA: 0};
  D.players.forEach(p => { if (p.squadra in IX.tot) IX.tot[p.squadra]++; });
  IX.ab = new Map(); IX.byEv = new Map();
  D.abs.forEach(r => {
    IX.ab.set(r.ev + '__' + r.p, r);
    if (!IX.byEv.has(r.ev)) IX.byEv.set(r.ev, []);
    IX.byEv.get(r.ev).push(r);
  });
}
const nome = n => (IX.pl.get(Number(n)) || {}).nome || '?';
const squadra = n => (IX.pl.get(Number(n)) || {}).squadra;
const tot = t => IX.tot[t] || 0;
const absTeam = (ev, t) => (IX.byEv.get(ev) || []).filter(r => squadra(r.p) == t);
const str = x => String(x ?? '').trim();
const pad2 = n => String(n).padStart(2, '0');
const serialDate = n => new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0, 10);
const serialTime = f => { const m = Math.round((f % 1) * 1440); return pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60); };
async function sha(s) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Browser non supportato (serve HTTPS).');
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
// PIN: nuovo formato = hash (pinh); formato vecchio = testo in chiaro (pin), ancora accettato
async function pinOk(o, pin, who) {
  if (o.pinh) return (await sha(code + ':' + who + ':' + pin)) === o.pinh;
  return str(o.pin) === String(pin);
}
function downloadBlob(name, text) {
  const u = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
  const l = document.createElement('a'); l.href = u; l.download = name;
  document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
}
const tag = e => e.canc ? `<span class="tag">ANNULLATO${e.pause ? ' · ' + esc(e.pause) : ''}</span>` : '';
const ttl = e => esc(e.title) + (e.desc ? ' · ' + esc(e.desc) : '');
const ab = (ev, p) => IX.ab.get(ev + '__' + Number(p));
const staffView = () => admin && tab == 'adm';
const dl = d => { const x = new Date(d + 'T12:00'); return GG[x.getDay()] + ' ' + x.getDate() + '/' + (x.getMonth() + 1); };

function rulesFor(team, day) {
  const v = SCHED().versions; let cur = v[0];
  v.forEach(x => { if (x.from <= day) cur = x; });
  return (cur.rules && cur.rules[team]) || [];
}
function recurring(from, to, team) {
  const r = [];
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const w = d.getDay(), s = iso(d), seen = {};
    rulesFor(team, s).filter(x => x.d == w).forEach(x => {
      const k = kOf(x.y); let id = s + '_' + team[0] + '_' + k;
      const n = seen[id] = (seen[id] || 0) + 1; if (n > 1) id += '_' + n;
      r.push({id, date: s, time: x.t || '', team, k, title: x.y, pre: 1});
    });
  }
  return r;
}
const EVC = new Map();
function allEvs(a, b) {
  const A = iso(a), B = iso(b), key = A + '|' + B;
  let r = EVC.get(key); if (r) return r;
  if (EVC.size > 60) EVC.clear();
  r = [];
  const pg = {};
  D.extras.forEach(x => { if (x.date >= A && x.date <= B && (x.k || kOf(x.title)) == 'P') (pg[x.date] ??= new Set()).add(x.team); });
  const hasP = (date, team) => { const s = pg[date]; return !!s && (s.has('TUTTE') || s.has(team)); };
  ['BIANCA', 'ROSSA'].forEach(t => recurring(a, b, t).forEach(e => {
    const o = D.mods[e.id];
    if (!o && e.k == 'P' && hasP(e.date, e.team)) return;
    if (o) { if (o.time !== undefined) e.time = o.time; if (o.title) e.title = o.title; if (o.team) e.team = o.team; e.desc = o.desc || ''; if (o.cancel) e.canc = 1; }
    e.k = kOf(e.title);
    const p = D.pause.find(z => z.from <= e.date && e.date <= z.to && (z.team == 'TUTTE' || z.team == e.team) && (z.what == 'Tutto' || (z.what == 'Allenamenti' ? e.k == 'A' : e.k == 'P')));
    if (p) { e.canc = 1; e.pause = p.note || 'pausa'; }
    r.push(e);
  }));
  D.extras.forEach(x => {
    if (x.date < A || x.date > B) return;
    ['BIANCA', 'ROSSA'].forEach(t => { if (x.team == 'TUTTE' || x.team == t) r.push({id: x.id, date: x.date, time: x.time || '', team: t, tm: x.team, k: x.k || kOf(x.title), title: x.title, desc: x.desc || '', x: 1}); });
  });
  r.sort((p, q) => (p.date + p.time).localeCompare(q.date + q.time));
  EVC.set(key, r); return r;
}
const evs = (team, a, b, wc) => allEvs(a, b).filter(e => e.team == team && (wc || !e.canc));
function range() {
  const n = new Date(); n.setHours(0,0,0,0);
  const m = new Date(n); m.setDate(n.getDate() - ((n.getDay() + 6) % 7) + 7 * V().wk);
  const e = new Date(m); e.setDate(m.getDate() + 6); return [m, e];
}
function dayMap(a, b) {
  const m = {}, teams = staffView() ? ['BIANCA', 'ROSSA'] : [squadra(me)];
  teams.forEach(t => evs(t, a, b, staffView()).forEach(e => { (m[e.date] ??= {BIANCA: [], ROSSA: []})[t].push(e); }));
  return m;
}

function block(e, t, sv) {
  const head = `<span class="${e.canc ? 'canc' : ''}"><b>${esc(e.time) || '—'}</b><br>${ttl(e)}</span>${tag(e)}`;
  if (sv) {
    const n = absTeam(e.id, t).length;
    return `<div class="blk ${t}"><b>${t == 'BIANCA' ? 'Bianca' : 'Rossa'}</b> · ${head}<br><span class="${n ? 'bad' : ''}">${n} assenti su ${tot(t)}</span></div>`;
  }
  return `<div class="blk ${t}">${head}</div>`;
}

function staffSummaryHTML(m) {
  const A = [], P = [];
  Object.keys(m).sort().forEach(d => ['BIANCA', 'ROSSA'].forEach(t => m[d][t].forEach(e => {
    if (e.canc) return;
    (e.k == 'A' ? A : P).push({e, t, d, as: absTeam(e.id, t).sort((p, q) => nome(p.p).localeCompare(nome(q.p)))});
  })));
  if (!A.length && !P.length) return '';
  const item = x => `<div class="si" data-day="${x.d}"><b>${dl(x.d)}</b> <span class="tb ${x.t}">${x.t == 'BIANCA' ? 'Bianca' : 'Rossa'}</span> ${esc(x.e.title)}<br>` +
    (x.as.length ? `<span class="bad">${x.as.length} assenti:</span> ${x.as.map(r => esc(nome(r.p))).join(', ')}` : '<span class="okk">✔ Nessuna assenza</span>') + '</div>';
  const card = (title, list) => `<div class="sc"><h4>${title}</h4>${list.length ? list.map(item).join('') : '<div class="si" style="cursor:default">Nessun evento</div>'}</div>`;
  return `<div class="sh">📋 Sintesi assenze della settimana</div><div class="sg">${card('🏃 Allenamenti', A)}${card('⚽ Partite e tornei', P)}</div>`;
}

function weekHTML(m) {
  const ds = Object.keys(m).sort(), sv = staffView(), td = iso(new Date());
  if (!ds.length) return '<p>Nessun evento in questa settimana.</p>';

function parseDate(x) {
  let m = x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

  m = x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
}

    const date = typeof c[0] == 'number' ? serialDate(c[0]) : parseDate(str(c[0]));
    if (!date) { if (i > 0) bad.push(i + 1); return; }
    const time = typeof c[1] == 'number' ? serialTime(c[1]) : str(c[1]), team = str(c[2]).toUpperCase(), title = TMAP[str(c[3]).toLowerCase()];
    if (!['BIANCA', 'ROSSA', 'TUTTE'].includes(team) || !title) { bad.push(i + 1); return; }
    ok.push({date, time, team, k: kOf(title), title, desc: str(c[4])});
  });
  if (!ok.length) return alert('Nessun evento valido. Controlla le colonne: data;orario;squadra;tipo;dettagli');
  for (let i = 0; i < ok.length; i += 400) {
    const wb = writeBatch(db);
    ok.slice(i, i + 400).forEach(o => wb.set(ref('eventi', 'i_' + [o.date, o.team, o.title, o.time].join('_').replace(/[^A-Za-z0-9_-]/g, '-')), o));
    await wb.commit();
  }
  closeModal(); alert(ok.length + ' eventi caricati.' + (bad.length ? ' Righe ignorate, da controllare: ' + bad.join(', ') + '.' : ''));
}
function report(from, to) {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const A = new Date(from + 'T12:00'); let B = new Date(to + 'T12:00'); if (B > today) B = today;
  if (isNaN(A) || isNaN(B) || A > B) return alert('Intervallo di date non valido.');
  const E = {BIANCA: evs('BIANCA', A, B), ROSSA: evs('ROSSA', A, B)};   // calcolati una volta per squadra
  let csv = '\uFEFFGiocatore;Squadra;Allenamenti;Assenze allenamenti;Partite;Assenze partite;% presenza\n';
  D.players.forEach(p => {
    let ta = 0, aa = 0, tp = 0, ap = 0;
    (E[p.squadra] || []).forEach(e => { const x = ab(e.id, p.n) ? 1 : 0; if (e.k == 'P') { tp++; ap += x; } else { ta++; aa += x; } });
    const t = ta + tp, pct = t ? Math.round(100 * (t - aa - ap) / t) : '';
    csv += `"${String(p.nome).replace(/"/g, '""')}";${p.squadra};${ta};${aa};${tp};${ap};${pct}\n`;
  });
  downloadBlob(`report_presenze_${from}_${iso(B)}.csv`, csv);
}
let cfg = null;
function checkAuto() {
  const aut = store.get('autenticato');
  if (aut === '1') {
    const savedAdmin = store.get('admin') === '1';
    const savedMe = store.get('me');
    if (savedAdmin) {
      admin = true; tab = 'adm'; render();
    } else if (savedMe) {
      me = savedMe; admin = false; tab = 'ev'; render();
    }
  }
}
async function submitPin() {
  const pin = $('#pin').value.trim(), err = $('#perr');
  if (!pin) return;
  try {
    if (cfg === null) { const s = await getDoc(ref('config', 'staff')); cfg = s.exists() ? s.data() : false; }
    if (cfg === false) {
      if (pin.length < 4) { err.textContent = 'Il PIN deve avere almeno 4 caratteri.'; return; }
      const pinh = await sha(code + ':staff:' + pin);
      await setDoc(ref('config', 'staff'), {pinh}); cfg = {pinh};
    } else if (!(await pinOk(cfg, pin, 'staff'))) { err.textContent = 'PIN errato, riprova.'; return; }
    else if (!cfg.pinh) { const pinh = await sha(code + ':staff:' + pin); await setDoc(ref('config', 'staff'), {pinh}); cfg = {pinh}; }
  } catch (_) { err.textContent = 'Connessione assente, riprova.'; return; }
  store.set('admin', '1'); store.set('autenticato', '1'); admin = true; tab = 'adm'; resetView(); closeModal(); render();
}

async function submitParentPin() {
  const pId = $('#sel_p').value, pin = $('#ppin').value.trim(), err = $('#perr');
  if (!pId) { err.textContent = 'Seleziona un giocatore.'; return; }
  if (!pin) { err.textContent = 'Inserisci il PIN.'; return; }
  const player = D.players.find(x => String(x.n) === String(pId));
  if (!player) { err.textContent = 'Giocatore non trovato.'; return; }
  let ok = false;
  try { ok = await pinOk(player, pin, 'p' + player.n); } catch (_) { err.textContent = 'Errore di verifica, riprova.'; return; }
  if (!ok) { err.textContent = 'PIN errato per questo giocatore.'; return; }
  resetView(); me = player.n; store.set('me', me); store.set('admin', '0'); store.set('autenticato', '1');
  admin = false; tab = 'ev'; closeModal(); render();
}

document.body.onchange = async e => {
  const f = e.target.files && e.target.files[0];
  if (e.target.id == 'adm_me') { me = Number(e.target.value) || ''; store.set('me', me); render(); }
  else if (e.target.dataset.addabs) {
    const ev = e.target.dataset.addabs, p = Number(e.target.value);
    if (p) { try { await setDoc(ref('assenze', ev + '__' + p), {ev, p, note: '', ts: Date.now()}); selN = ev + '__' + p; } catch (err) { alert('Errore: ' + (err.message || err)); } }
  }
  else if (e.target.id == 'ecsv' && f) { try { await importEvents(await readRows(f)); } catch (err) { alert('Errore: ' + (err.message || err)); } e.target.value = ''; }
  else if (e.target.id == 'csv' && f) {
    try {
      const rows = await readRows(f), righe = [], scartate = [];
      for (const [i, c] of rows.entries()) {
        const n = Number(c[0]), nome = str(c[1]), squadra = str(c[2]).toUpperCase(), pin = str(c[3]).padStart(4, '0');
        if (!(n > 0) || !nome) continue;   // intestazione o riga vuota
        if (!['BIANCA', 'ROSSA'].includes(squadra) || pin.length < 4) { scartate.push(i + 1); continue; }
        righe.push({n, nome, squadra, pinh: await sha(code + ':p' + n + ':' + pin)});
      }
      if (!righe.length) return alert('Nessun giocatore valido nel file (colonne: n;nome;squadra;pin).');
      const wb = writeBatch(db); righe.forEach(r => wb.set(ref('giocatori', String(r.n)), r)); await wb.commit();
      closeModal(); alert(righe.length + ' giocatori caricati con successo.' + (scartate.length ? ' Righe ignorate: ' + scartate.join(', ') + '.' : ''));
    } catch (err) { alert('Errore: ' + (err.message || err)); }
    e.target.value = '';
  }
};
document.body.onclick = async e => {
  const t = e.target;
  try {
    if (t.classList.contains('ov') || t.dataset.close !== undefined) closeModal();
    else if (t.dataset.upd !== undefined) { location.replace(location.pathname + '?c=' + encodeURIComponent(code) + '&r=' + Date.now()); }
    else if (t.dataset.seen !== undefined) { store.set('seen', String(Math.max(Date.now(), ...D.abs.map(r => r.ts || 0)))); render(); }
    else if (t.dataset.t) { tab = t.dataset.t; render(); }
    else if (t.dataset.loginType == 'staff') openModal('login_staff');
    else if (t.dataset.loginType == 'parent') openModal('login_parent');
    else if (t.id == 'pok') await submitPin();
    else if (t.id == 'ppok') await submitParentPin();
    else if (t.dataset.vw) { V().vw = t.dataset.vw; render(); }
    else if (t.dataset.wk) { V().wk += Number(t.dataset.wk); render(); }
    else if (t.dataset.cur !== undefined) { V().wk = 0; V().mon = {y: now0.getFullYear(), m: now0.getMonth()}; render(); }
    else if (t.dataset.tpl !== undefined) templateCsv();
    else if (t.dataset.tplx !== undefined) await templateXlsx();
    else if (t.dataset.radd) { readDraft(); draft.rules[t.dataset.radd].push({d: 1, t: '18:00–20:00', y: 'Allenamento'}); rerenderCal(); }
    else if (t.dataset.rdel) { readDraft(); const [tm, i] = t.dataset.rdel.split(':'); draft.rules[tm].splice(Number(i), 1); rerenderCal(); }
    else if (t.dataset.ssave !== undefined) {
      readDraft();
      if (!parseDate(draft.from)) return alert('Scegli la data di inizio validità.');
      const nv = SCHED().versions.filter(x => x.from !== draft.from).concat([{from: draft.from, rules: draft.rules}]).sort((a, b) => a.from.localeCompare(b.from));
      await setDoc(ref('config', 'schedule'), {versions: nv}); closeModal();
    }
    else if (t.dataset.vdel) {
      const nv = SCHED().versions.filter(x => x.from !== t.dataset.vdel);
      if (nv.length && confirm('Eliminare questo calendario programmato?')) { readDraft(); await setDoc(ref('config', 'schedule'), {versions: nv}); rerenderCal(); }
    }
    else if (t.dataset.padd !== undefined) {
      const o = {from: $('#pf').value, to: $('#pt').value, team: $('#pq').value, what: $('#pw').value, note: $('#pn').value.trim()};
      if (!o.from || !o.to || o.from > o.to) return alert('Controlla le date: "Dal" deve essere prima di "Al".');
      readDraft(); await addDoc(col('pause'), o); rerenderCal();
    }
    else if (t.dataset.pdel) { readDraft(); await deleteDoc(ref('pause', t.dataset.pdel)); rerenderCal(); }
    else if (t.dataset.canc) { const id = t.dataset.canc, cur = !!(D.mods[id] && D.mods[id].cancel); await setDoc(ref('modifiche', id), {cancel: !cur}, {merge: true}); }
    else if (t.dataset.mo) { const d = new Date(V().mon.y, V().mon.m + Number(t.dataset.mo), 1); V().mon = {y: d.getFullYear(), m: d.getMonth()}; render(); }
    else if (t.dataset.m) openModal(t.dataset.m);
    else if (t.dataset.n) { selN = selN == t.dataset.n ? null : t.dataset.n; render(); }
    else if (t.dataset.edit) openModal('edit', t.dataset.edit);
    else if (t.dataset.pick !== undefined) { me = ''; store.set('me', ''); render(); }
    else if (t.dataset.logout !== undefined) { 
      store.set('autenticato', ''); store.set('admin', ''); store.set('me', '');
      admin = false; me = ''; tab = 'ev'; resetView(); render(); 
    }
    else if (t.dataset.save) {
      const id = t.dataset.save, o = {time: $('#mt').value.trim(), title: $('#my').value, team: $('#mq').value, desc: $('#md').value.trim()};
      if (t.dataset.x == '1') await setDoc(ref('eventi', id), {...o, k: kOf(o.title)}, {merge: true});
      else await setDoc(ref('modifiche', id), {...o, cancel: $('#mc').checked});
      closeModal();
    }
    else if (t.dataset.reset) { await deleteDoc(ref('modifiche', t.dataset.reset)); closeModal(); }
    else if (t.dataset.delabs) { if (confirm('Eliminare questa assenza?')) { await deleteDoc(ref('assenze', t.dataset.delabs)); selN = null; render(); } }
    else if (t.dataset.del) { if (confirm('Eliminare questo evento?')) await deleteDoc(ref('eventi', t.dataset.del)); }
    else if (t.dataset.ev) {
      t.disabled = true;
      const note = t.parentElement.querySelector('.nt').value.trim(), ev = t.dataset.ev, id = ev + '__' + me;
      if (t.dataset.st == 'A') await setDoc(ref('assenze', id), {ev, p: Number(me), note, ts: (ab(ev, me) || {}).ts || Date.now()});
      else await deleteDoc(ref('assenze', id));
      closeModal(); render();
    } else if (t.id == 'ea') {
      const ty = $('#ek').value, o = {date: $('#ed').value, time: $('#et').value.trim(), team: $('#etm').value, k: kOf(ty), title: ty, desc: $('#eti').value.trim()};
      if (!o.date) return alert('Scegli la data.');
      await addDoc(col('eventi'), o); closeModal();
    } else if (t.id == 'dr') report($('#rf').value, $('#rt').value);
    else {
      const c = t.closest('[data-day]');
      if (c) { if (staffView()) { sel = c.dataset.day; selN = null; render(); } else openModal('day', c.dataset.day); }
    }
  } catch (err) { if (t && t.tagName == 'BUTTON') t.disabled = false; alert('Errore: ' + (err.message || err)); render(); }
};

const fail = () => { main.textContent = 'Impossibile caricare i dati. Controlla la connessione e il link.'; };
const dataChanged = () => { EVC.clear(); render(); };
onSnapshot(col('giocatori'), s => { D.players = s.docs.map(d => d.data()).sort((a, b) => a.nome.localeCompare(b.nome)); reindex(); playersReady = true; render(); }, fail);
onSnapshot(col('eventi'), s => { D.extras = s.docs.map(d => ({id: d.id, ...d.data()})); dataChanged(); }, fail);
onSnapshot(col('modifiche'), s => { D.mods = {}; s.docs.forEach(d => { D.mods[d.id] = d.data(); }); dataChanged(); }, fail);
onSnapshot(col('pause'), s => { D.pause = s.docs.map(d => ({id: d.id, ...d.data()})); dataChanged(); }, fail);
onSnapshot(ref('config', 'schedule'), s => { D.sched = s.exists() ? s.data() : null; dataChanged(); }, () => {});
onSnapshot(ref('config', 'staff'), s => { cfg = s.exists() ? s.data() : false; checkAuto(); }, () => {});

// Assenze: lo staff le legge tutte, il genitore solo quelle del proprio figlio (meno letture Firestore)
let unsubAbs = null, absMode = null;
function syncAbs() {
  const mode = store.get('autenticato') !== '1' ? '' : admin ? 'all' : me ? 'me:' + Number(me) : '';
  if (mode === absMode) return;
  absMode = mode; if (unsubAbs) { unsubAbs(); unsubAbs = null; }
  D.abs = []; reindex();
  if (!mode) return;
  const q = mode === 'all' ? col('assenze') : query(col('assenze'), where('p', '==', Number(me)));
  unsubAbs = onSnapshot(q, s => { D.abs = s.docs.map(d => d.data()); reindex(); render(); }, fail);
}
document.body.onkeydown = e => {
  if (e.key == 'Escape') closeModal();
  else if (e.key == 'Enter' && e.target.id == 'pin') submitPin();
  else if (e.key == 'Enter' && e.target.id == 'ppin') submitParentPin();
};
// Se l'app resta in background più di 5 minuti, al rientro riparte dalla settimana corrente
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else { checkUpdate(); }
  if (!document.hidden && hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) { hiddenAt = 0; closeModal(); resetView(); render(); }
});
checkAuto();
checkUpdate();

<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenze Esordienti 2015</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presenze">
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:12px;background:#f4f4f4;color:#222}
h1{font-size:1.25rem}h3{margin:16px 0 4px}
select,input,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #bbb;box-sizing:border-box;margin:2px 0}
select,input:not([type=date]):not([type=file]){width:100%}
button{background:#fff;cursor:pointer}button:disabled{opacity:.5}
.card{background:#fff;border-radius:10px;padding:10px;margin:8px 0;border-left:7px solid #aaa}
.card.ROSSA{border-color:#c0392b}.card.BIANCA{border-color:#bbb}
.card.ass{background:#fdecea}
small{color:#666}
</style></head><body>
<div id="app">Caricamento…</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore, collection, doc, setDoc, addDoc, deleteDoc, getDoc, onSnapshot, writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ===== CONFIGURAZIONE: incolla qui i dati del tuo progetto Firebase =====
const FB = {
  apiKey: "AIzaSyBkIw4tdL9Lz8Rr1_kr7XzzVy1IQOs2ZCw",
  authDomain: "gestione-assenze-e87d7.firebaseapp.com",
  projectId: "gestione-assenze-e87d7",
  storageBucket: "gestione-assenze-e87d7.firebasestorage.app",
  messagingSenderId: "531728262014",
  appId: "1:531728262014:web:30f6d602c16dcb25a0092f"
};
const INIZIO = '2026-09-01';   // inizio stagione (per il report)
// ========================================================================

const $ = s => document.querySelector(s);
const root = $('#app');
const Q = new URLSearchParams(location.search);
if (Q.get('c')) localStorage.c = Q.get('c');
const code = localStorage.c || '';
if (!FB.projectId) { root.textContent = 'Configurazione Firebase mancante nel file index.html.'; throw 0; }
if (!code) { root.textContent = 'Usa il link ricevuto dalla società (quello con ?c=...).'; throw 0; }

const db = getFirestore(initializeApp(FB));
const col = n => collection(db, 's', code, n);
const ref = (n, id) => doc(db, 's', code, n, id);
const D = {players: [], extras: [], abs: []};
let me = localStorage.me || '', month = false, tab = 'ev', admin = false;

const GG = ['dom','lun','mar','mer','gio','ven','sab'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nome = n => (D.players.find(x => x.n == n) || {}).nome || '?';
const squadra = n => (D.players.find(x => x.n == n) || {}).squadra;
const ab = (ev, p) => D.abs.find(r => r.ev == ev && r.p == p);

// Calendario fisso: martedì entrambe 18-20, giovedì Bianca 18:30-20, venerdì Rossa 18-19:30, sabato partita
function recurring(from, to, team) {
  const r = [];
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const w = d.getDay(), s = iso(d); let t = null, k = 'A';
    if (w == 2) t = '18:00–20:00';
    if (w == 4 && team == 'BIANCA') t = '18:30–20:00';
    if (w == 5 && team == 'ROSSA') t = '18:00–19:30';
    if (w == 6) { t = ''; k = 'P'; }
    if (t !== null) r.push({id: s + '_' + team[0] + '_' + k, date: s, time: t, team, k, title: k == 'P' ? 'Partita' : 'Allenamento'});
  }
  return r;
}
function evs(team, a, b) {
  const A = iso(a), B = iso(b), r = recurring(a, b, team);
  D.extras.forEach(x => { if (x.date >= A && x.date <= B && (x.team == 'TUTTE' || x.team == team)) r.push({id: x.id, date: x.date, time: x.time || '', team, k: x.k, title: x.title, x: 1}); });
  return r.sort((p, q) => (p.date + p.time).localeCompare(q.date + q.time));
}
function range() {
  const n = new Date(); n.setHours(0,0,0,0);
  if (month) return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 0)];
  const m = new Date(n); m.setDate(n.getDate() - ((n.getDay() + 6) % 7));
  const e = new Date(m); e.setDate(m.getDate() + 6); return [m, e];
}
const dl = e => { const d = new Date(e.date + 'T12:00'); return GG[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };

function parentView(a, b) {
  const t = squadra(me);
  let h = `<p><b>${month ? 'Mese corrente' : 'Settimana corrente'}</b> · squadra ${t} <button id="mm">${month ? 'Solo settimana' : 'Vedi tutto il mese'}</button></p>`;
  evs(t, a, b).forEach(e => {
    const x = ab(e.id, me);
    h += `<div class="card ${t} ${x ? 'ass' : ''}"><b>${dl(e)}</b> ${esc(e.time)} · ${esc(e.title)}${x ? ' — <b>ASSENTE</b>' : ''}<br>
      <input class="nt" maxlength="200" placeholder="Motivo / note (facoltativo)" value="${esc(x ? x.note : '')}">
      ${x ? `<button data-ev="${e.id}" data-st="A">Aggiorna nota</button> <button data-ev="${e.id}" data-st="OK">Sarà presente</button>`
          : `<button data-ev="${e.id}" data-st="A">Segnala assenza</button>`}</div>`;
  });
  return h;
}
function adminView(a, b) {
  let h = `<h3>Assenti ${month ? 'del mese' : 'della settimana'}</h3><button id="mm">${month ? 'Solo settimana' : 'Tutto il mese'}</button> <small>aggiornamento in tempo reale</small>`;
  ['BIANCA', 'ROSSA'].forEach(t => evs(t, a, b).forEach(e => {
    const as = D.abs.filter(r => r.ev == e.id && squadra(r.p) == t);
    h += `<div class="card ${t}"><b>${t} · ${dl(e)}</b> ${esc(e.time)} ${esc(e.title)}${e.x ? ` <button data-del="${e.id}">Elimina</button>` : ''}<br>
      <b>${as.length} assenti su ${D.players.filter(p => p.squadra == t).length}</b><br>
      ${as.length ? as.map(r => esc(nome(r.p)) + (r.note ? ' (' + esc(r.note) + ')' : '')).join('; ') : 'nessuna assenza'}</div>`;
  }));
  h += `<h3>Aggiungi evento extra</h3><div class="card"><input type="date" id="ed"> <input id="et" placeholder="Orario (es. 10:00–12:00)">
    <select id="etm"><option>TUTTE</option><option>BIANCA</option><option>ROSSA</option></select>
    <select id="ek"><option value="A">Allenamento / altro</option><option value="P">Partita</option></select>
    <input id="eti" maxlength="80" placeholder="Titolo (es. Partita domenica vs …)"><button id="ea">Aggiungi</button></div>
    <h3>Report</h3><button id="rp">⬇ Scarica report presenze (CSV per Excel)</button>
    <h3>Elenco giocatori</h3><small>${D.players.length} giocatori caricati. Per caricarli o aggiornarli scegli il file giocatori.csv:</small><br><input type="file" id="csv" accept=".csv,text/csv,text/plain">`;
  return h;
}
function render() {
  if (document.activeElement && document.activeElement.classList.contains('nt')) return; // non cancellare la nota mentre la scrivono
  const [a, b] = range();
  let h = `<h1>⚽ Esordienti 2015 – presenze</h1><select id="pl"><option value="">Scegli il giocatore…</option>` +
    D.players.map(p => `<option value="${p.n}" ${p.n == me ? 'selected' : ''}>${esc(p.nome)}</option>`).join('') + `</select>`;
  h += admin ? `<p><button data-t="ev">Vista genitore</button> <button data-t="adm">Vista staff</button></p>` : `<p><button id="st">Area staff</button></p>`;
  if (!D.players.length && !admin) h += '<p>Elenco giocatori non ancora caricato.</p>';
  if (admin && tab == 'adm') h += adminView(a, b); else if (me && squadra(me)) h += parentView(a, b);
  root.innerHTML = h;
}
function report() {
  const today = new Date(); today.setHours(0,0,0,0);
  let csv = '\ufeffGiocatore;Squadra;Allenamenti;Assenze allenamenti;Partite;Assenze partite;% presenza\n';
  D.players.forEach(p => {
    const ev = evs(p.squadra, new Date(INIZIO), today); let ta = 0, aa = 0, tp = 0, ap = 0;
    ev.forEach(e => { const x = ab(e.id, p.n) ? 1 : 0; if (e.k == 'P') { tp++; ap += x; } else { ta++; aa += x; } });
    const tot = ta + tp, pct = tot ? Math.round(100 * (tot - aa - ap) / tot) : '';
    csv += `"${p.nome}";${p.squadra};${ta};${aa};${tp};${ap};${pct}\n`;
  });
  const l = document.createElement('a');
  l.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  l.download = 'report_presenze_' + iso(today) + '.csv'; l.click();
}
async function staff() {
  const r = ref('config', 'staff'), s = await getDoc(r); let pin;
  if (!s.exists()) {
    pin = prompt('Prima volta: scegli un PIN per l\'area staff (almeno 4 caratteri)');
    if (!pin || pin.length < 4) return;
    await setDoc(r, {pin});
  } else {
    pin = prompt('PIN area staff');
    if (pin !== s.data().pin) { if (pin !== null) alert('PIN errato'); return; }
  }
  localStorage.pin = pin; admin = true; tab = 'adm'; render();
}

root.onchange = async e => {
  if (e.target.id == 'pl') { me = e.target.value; localStorage.me = me; render(); }
  else if (e.target.id == 'csv' && e.target.files[0]) {
    const righe = (await e.target.files[0].text()).split(/\r?\n/).map(l => l.split(';')).map(c => ({n: Number(c[0]), nome: (c[1] || '').trim().replace(/^"|"$/g, ''), squadra: (c[2] || '').trim().toUpperCase()}))
      .filter(r => r.n > 0 && r.nome && (r.squadra == 'BIANCA' || r.squadra == 'ROSSA'));
    if (!righe.length) return alert('Nessun giocatore valido nel file (formato: n;nome;squadra).');
    const wb = writeBatch(db); righe.forEach(r => wb.set(ref('giocatori', String(r.n)), r)); await wb.commit();
    alert(righe.length + ' giocatori caricati.');
  }
};
root.onclick = async e => {
  const t = e.target;
  try {
    if (t.dataset.t) { tab = t.dataset.t; render(); }
    else if (t.id == 'mm') { month = !month; render(); }
    else if (t.id == 'rp') report();
    else if (t.id == 'st') await staff();
    else if (t.dataset.del) { if (confirm('Eliminare questo evento?')) await deleteDoc(ref('eventi', t.dataset.del)); }
    else if (t.dataset.ev) {
      t.disabled = true;
      const note = t.parentElement.querySelector('.nt').value.trim(), ev = t.dataset.ev, id = ev + '__' + me;
      if (t.dataset.st == 'A') await setDoc(ref('assenze', id), {ev, p: Number(me), note, ts: Date.now()});
      else await deleteDoc(ref('assenze', id));
      render();
    } else if (t.id == 'ea') {
      const o = {date: $('#ed').value, time: $('#et').value, team: $('#etm').value, k: $('#ek').value, title: $('#eti').value.trim()};
      if (!o.date || !o.title) return alert('Servono almeno data e titolo.');
      await addDoc(col('eventi'), o);
    }
  } catch (err) { alert('Errore: ' + (err.message || err)); render(); }
};

const fail = () => { root.textContent = 'Impossibile caricare i dati. Controlla la connessione e il link.'; };
onSnapshot(col('giocatori'), s => { D.players = s.docs.map(d => d.data()).sort((a, b) => a.nome.localeCompare(b.nome)); render(); }, fail);
onSnapshot(col('eventi'), s => { D.extras = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }, fail);
onSnapshot(col('assenze'), s => { D.abs = s.docs.map(d => d.data()); render(); }, fail);
if (localStorage.pin) getDoc(ref('config', 'staff')).then(s => { if (s.exists() && s.data().pin === localStorage.pin) { admin = true; tab = 'adm'; render(); } }).catch(() => {});
</script></body></html>
